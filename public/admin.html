<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Material Notes | 内容审核</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/community.css"><script src="/admin.js" defer></script></head><body><main class="dash"><a href="/">← 返回网站</a><h1>社区内容审核</h1><p>仅管理员使用。请使用存放在 Cloudflare Secret <code>ADMIN_REVIEW_TOKEN</code> 中的密钥。登录凭证不存储于浏览器。</p><div class="panel"><label for="admin-key">管理密钥（仅当前页面内存）</label><input id="admin-key" type="password" autocomplete="off" placeholder="ADMIN_REVIEW_TOKEN"><button id="admin-load">登录并加载</button><button id="admin-logout">退出</button></div><div class="panel"><label for="review-filter">显示状态</label><select id="review-filter"><option value="all">全部记录</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select><label for="review-source">类型</label><select id="review-source"><option value="all">全部类型</option><option value="community">文献分享</option><option value="knowledge">知识笔记</option></select><label for="review-sort">排序</label><select id="review-sort"><option value="newest">最新</option><option value="oldest">最早</option><option value="title">标题 A-Z</option><option value="title_desc">标题 Z-A</option></select><label for="review-q">搜索</label><input id="review-q" type="search" placeholder="搜索标题或总结"><button id="review-search" type="button">筛选</button><p id="admin-status" role="status">请先输入密钥。</p></div><div id="admin-list"></div><div class="page-controls"><button id="admin-prev">上一页</button><span id="admin-page"></span><button id="admin-next">下一页</button></div></main></body></html>
